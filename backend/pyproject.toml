[project]
name = "audidle-backend"
version = "0.1.0"
description = "Backend for Audidle, a progressive clip music guessing game"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "anyio>=4.4",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# str + Enum is the conventional FastAPI pattern and serializes predictably in
# both Pydantic and JSON. StrEnum would work too, this is a style choice.
ignore = ["UP042"]
